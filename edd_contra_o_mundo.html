:root{
  --mt:clamp(120px,20vh,180px);--green:#4cae3c; --ink:#000; --paper:#fff;
  --f-title:"Eastwood","Rye",serif;
  --f-ui:"Edds","Edd’s Font","Patrick Hand",cursive;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--green);font-family:var(--f-ui);color:var(--paper);overflow:hidden}

#bg{position:fixed;inset:0;overflow:hidden;z-index:0}
#bg div{position:absolute;inset:-240px;
  background:conic-gradient(rgba(0,0,0,.2) 25%,transparent 0 50%,rgba(0,0,0,.2) 0 75%,transparent 0);
  background-size:120px 120px;animation:drift 4s linear infinite}
@keyframes drift{to{background-position:120px 120px}}

#menu{position:fixed;z-index:1;width:min(390px,92vw);left:4vw;top:var(--mt);max-height:calc(100dvh - var(--mt) - 24px);overflow:auto;
  background:var(--ink);border:4px solid var(--paper);padding:22px 18px 16px}
h1 img{display:block;width:100%;height:auto}
h1{font:400 clamp(30px,6vw,46px)/1 var(--f-title);margin:0 0 4px;letter-spacing:.02em}
#menu[hidden]{display:none}
#sub{font-size:22px;margin:0 0 14px;opacity:.75}
#list{display:flex;flex-direction:column;gap:2px}
#list button{font:inherit;font-size:28px;line-height:1.15;text-align:left;color:var(--paper);
  background:transparent;border:0;padding:6px 12px;cursor:pointer}
#list button:hover,#list button:focus-visible{background:var(--paper);color:var(--ink);outline:none}
#note{font-size:22px;line-height:1.25;margin:14px 0 0;min-height:1px}
#note:empty{display:none}
footer{margin-top:18px;padding-top:10px;border-top:2px solid var(--paper);font-size:18px;opacity:.8}

#wipe{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
  background:conic-gradient(#000 25%,#fff 0 50%,#000 0 75%,#fff 0);background-size:80px 80px;
  animation:drift 3s linear infinite;opacity:0}
#wipe[hidden]{display:none}
#wipe span{font:400 clamp(36px,9vw,76px)/1 var(--f-title);background:#000;color:#fff;
  border:4px solid #fff;padding:.2em .5em}

#intro{position:fixed;inset:0;z-index:20;background:#000;transition:background .8s;cursor:pointer}
#intro.lit{background:transparent}
#intro[hidden]{display:none}
.card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:6vw;text-align:center;opacity:0;transition:opacity .8s;pointer-events:none}
.card.on{opacity:1}
.card p{margin:0;font:400 clamp(22px,4.5vw,38px)/1.2 var(--f-ui);color:#fff}
.card p.big{font-family:var(--f-title);font-size:clamp(34px,8vw,72px)}
.card img.series{width:min(80vw,520px);height:auto}
#t-logo{width:min(84vw,640px);height:auto;transform:scale(.3);opacity:0;transition:transform .7s cubic-bezier(.3,1.6,.5,1),opacity .3s}
.card.on #t-logo{transform:scale(1);opacity:1}
.card p.sub{color:#fff;text-shadow:0 3px 0 #000,0 0 12px #000;opacity:0;transition:opacity .8s .7s}
.card.on p.sub{opacity:1}
#logo{position:fixed;z-index:25;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;white-space:nowrap;pointer-events:none;transition:top .9s ease-in-out,transform .9s ease-in-out}
#logo.top{top:calc(env(safe-area-inset-top,0px) + 2.5vh);transform:translate(-50%,0)}
#logo .words{font:400 min(6.8vw,96px)/1 var(--f-title);transition:font-size .9s ease-in-out;-webkit-text-stroke:2px #000;paint-order:stroke fill;text-shadow:0 5px 0 #000}
#logo.top .words{font-size:min(4.6vw,58px)}
.words span{display:inline-block;opacity:0}
.words span.on{opacity:1;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.4)}to{transform:scale(1)}}
.w1{color:#2f8f2f}.w2{color:#fff}.w3{color:#d62a1e}
#logo .sub{margin:10px 0 0;font:400 min(3.2vw,30px) var(--f-ui);color:#fff;opacity:0;transition:opacity .8s,font-size .9s;text-shadow:0 3px 0 #000}
#logo .sub.on{opacity:1}
#logo.top .sub{font-size:min(2.4vw,20px)}
#menu:not([hidden]),#chars:not([hidden]){animation:fadein .5s}
@keyframes fadein{from{opacity:0}}
#chars{position:fixed;z-index:1;left:4vw;right:4vw;top:var(--mt);max-height:calc(100dvh - var(--mt) - 24px);overflow:auto;display:grid;grid-template-columns:minmax(220px,340px) 1fr;background:#000;border:4px solid #fff}
#chars[hidden]{display:none}
#chars .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px;border-right:4px solid #fff;align-content:start}
.card-ch{font:inherit;color:#fff;background:#000;border:3px solid #fff;padding:8px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.card-ch .ini{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:var(--c);font:400 clamp(36px,6vw,60px) var(--f-title);color:#fff;text-shadow:0 3px 0 #000}
.card-ch .nm{font-size:22px}
.card-ch:hover,.card-ch:focus-visible{background:#fff;color:#000;outline:none}
.card-ch.lock .ini{background:#333;color:#888}
#chars .vb{grid-column:1/-1;font:inherit;font-size:26px;text-align:left;color:#fff;background:transparent;border:0;padding:6px 12px;cursor:pointer}
#chars .vb:hover,#chars .vb:focus-visible{background:#fff;color:#000;outline:none}
.detail{padding:16px 20px;font-size:22px;line-height:1.3}
.detail h2{font:400 clamp(30px,5vw,48px)/1 var(--f-title);margin:0}
.detail .tag{margin:6px 0 4px;opacity:.8}
.detail .quote{margin:0 0 10px;color:#ddd}
.detail .desc{margin:0 0 14px;max-width:62ch}
.row{display:grid;grid-template-columns:52px 1fr 70px;align-items:center;gap:10px;margin:3px 0}
.bar{height:14px;border:2px solid #fff}.bar b{display:block;height:100%;background:#fff}
.pips{display:flex;gap:4px}.pips i{flex:1;height:14px;border:2px solid #fff}.pips i.on{background:#fff}
.detail .hint{margin-top:12px;opacity:.7;font-size:18px}
@media (max-width:700px){#chars{grid-template-columns:1fr}#chars .grid{border-right:0;border-bottom:4px solid #fff;grid-template-columns:repeat(4,1fr)}.card-ch .nm{font-size:16px}}
#bg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 70% 50%,transparent 35%,rgba(0,0,0,.5))}
#menu{border-width:5px;box-shadow:8px 8px 0 #000}
#sub{display:inline-block;background:#2f8f2f;color:#fff;font:400 20px/1 var(--f-title);padding:6px 12px;border:3px solid #fff;transform:rotate(-1.5deg);opacity:1;margin:0 0 14px}
#list button{font-size:26px;padding:5px 12px 5px 30px;position:relative;transition:transform .12s}
#list button::before{content:"▶";position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:.65em;opacity:0;color:#2f8f2f}
#list button.pri{font-family:var(--f-title);font-size:30px;color:#6ee05a;margin-bottom:6px}
#list button:hover,#list button:focus-visible{background:#fff;color:#000;transform:translateX(6px) rotate(-1deg)}
#list button:hover::before,#list button:focus-visible::before{opacity:1}
#hero{position:fixed;right:6vw;bottom:0;height:min(72vh,620px);width:auto;z-index:1;pointer-events:none;filter:drop-shadow(6px 6px 0 rgba(0,0,0,.45));transform-origin:50% 100%;animation:bob 2.6s ease-in-out infinite}
#hero[hidden]{display:none}
@keyframes bob{50%{transform:scaleY(1.02) translateY(-6px)}}
@media (max-width:1000px){#hero{display:none}}
.card-ch .ini{align-items:flex-start;overflow:hidden}
.card-ch .ini img{width:100%;display:block}
.detail{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:start}
.detail .big{order:2;height:min(52vh,400px);width:auto;max-width:34vw}
.detail .af{margin:0 0 12px;color:#6ee05a}
@media (max-width:700px){.detail .big{display:none}.detail{grid-template-columns:1fr}}
#page{position:fixed;z-index:1;left:4vw;right:4vw;top:var(--mt);max-height:calc(100dvh - var(--mt) - 24px);overflow:auto;background:#000;border:5px solid #fff;box-shadow:8px 8px 0 #000;padding:0 20px 20px}
#page[hidden]{display:none}
#page header{position:sticky;top:0;z-index:2;background:#000;display:flex;align-items:center;gap:16px;padding:14px 0 10px;border-bottom:3px solid #fff}
#page h2{font:400 clamp(26px,4vw,40px)/1 var(--f-title);margin:0;flex:1}
#page .cnt{font-size:22px;opacity:.8}
#page .vb{font:inherit;font-size:24px;color:#fff;background:transparent;border:3px solid #fff;padding:2px 14px;cursor:pointer}
#page .vb:hover,#page .vb:focus-visible{background:#fff;color:#000;outline:none}
.it{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;padding:12px 0;border-bottom:2px solid #333;font-size:22px;line-height:1.2}
.it b{display:block;font-weight:400;font-size:26px}
.it span.d{opacity:.8}
.it .ic{width:48px;height:48px;border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-size:26px}
.it.off{opacity:.55}
.it.on .ic{background:#2f8f2f}
.it .st{font-size:20px;opacity:.8}
.it .md{border-radius:50%;color:#000;background:var(--m);border-color:#000;box-shadow:0 0 0 3px #fff}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;padding-top:16px}
.bx{border:3px solid #fff;padding:12px 16px;font-size:22px;line-height:1.3}
.bx h3{font:400 24px/1 var(--f-title);margin:0 0 8px;color:#6ee05a}
.bx p{margin:0 0 8px}
.bx .badge{display:inline-block;border:2px solid #fff;padding:0 8px;font-size:18px}
#toast{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;background:#000;border:4px solid #fff;padding:10px 16px;font-size:22px;max-width:80vw;transform:translateY(160%);transition:transform .4s}
#toast.on{transform:none}
#page.opts{background-color:#1553a3;background-image:linear-gradient(rgba(255,255,255,.2) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.2) 1px,transparent 1px),linear-gradient(rgba(255,255,255,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.09) 1px,transparent 1px);background-size:96px 96px,96px 96px,16px 16px,16px 16px}
#page.opts header{background:#1553a3;border-bottom:2px dashed #fff}
.bp{display:grid;gap:22px;padding-top:18px}
.bp .note{margin:0;font-size:22px;opacity:.85}
.cmp{display:grid;grid-template-columns:minmax(170px,250px) 1fr 80px;gap:16px;align-items:center;font-size:26px;border:2px dashed rgba(255,255,255,.75);padding:12px 16px}
.cmp label{display:flex;align-items:center;gap:10px}
.cmp label b{width:32px;height:32px;border:2px solid #fff;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:400;font-size:20px}
.bp input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:34px;background:transparent;margin:0;cursor:pointer}
.bp input[type=range]::-webkit-slider-runnable-track{height:12px;border:2px solid #fff;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 2px),rgba(255,255,255,.7) calc(10% - 2px) 10%)}
.bp input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:32px;margin-top:-13px;background:#fff;border:3px solid #0b2f66}
.bp input[type=range]::-moz-range-track{height:8px;border:2px solid #fff;background:transparent}
.bp input[type=range]::-moz-range-thumb{width:12px;height:28px;border-radius:0;background:#fff;border:3px solid #0b2f66}
.bp input[type=range]:focus-visible{outline:2px dashed #fff;outline-offset:4px}
.bp output{text-align:right;font-size:28px}
.sw{font:inherit;font-size:24px;color:#fff;background:transparent;border:2px solid #fff;padding:4px 14px 4px 4px;display:inline-flex;align-items:center;gap:10px;cursor:pointer;justify-self:start}
.sw i{width:26px;height:26px;border:2px solid currentColor;display:block}
.sw[aria-checked=true] i{background:currentColor}
.sw:hover,.sw:focus-visible{background:#fff;color:#1553a3;outline:none}
.tb{display:grid;grid-template-columns:2fr 1fr 1fr;border:2px solid #fff;max-width:520px;margin-left:auto;font-size:18px}
.tb div{padding:6px 10px;border-right:2px solid #fff}
.tb div:last-child{border:0}
.tb b{display:block;font:400 22px/1.1 var(--f-ui)}
@media (max-width:700px){.cmp{grid-template-columns:1fr}.cmp output{text-align:left}}
.deck{display:grid;grid-template-columns:minmax(260px,420px) 1fr;gap:24px;padding-top:18px;align-items:start}
.tt{position:relative;aspect-ratio:1.08;background:#9b6a3a;border:5px solid #000;box-shadow:0 0 0 3px #fff,8px 8px 0 3px #444;margin:0 6px 6px 3px}
.plat{position:absolute;left:6%;top:9%;width:72%;aspect-ratio:1;border-radius:50%;background:#444;border:4px solid #000;display:flex;align-items:center;justify-content:center}
.vinyl{position:relative;width:94%;aspect-ratio:1;border-radius:50%;border:3px solid #000;background:repeating-radial-gradient(circle,#111 0 3px,#222 3px 5px);display:flex;align-items:center;justify-content:center}
.vinyl::after{content:"";position:absolute;top:10%;left:14%;width:28%;height:9%;background:rgba(255,255,255,.18);border-radius:50%;transform:rotate(-35deg)}
.lab{width:36%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#000 0 6%,var(--col) 7%);border:3px solid #000}
.tt.on .vinyl{animation:spin 1.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.arm{position:absolute;right:11%;top:12%;width:46%;height:8px;background:#e6e6e6;border:3px solid #000;border-radius:6px;transform-origin:100% 50%;transform:rotate(16deg);transition:transform .8s}
.arm::after{content:"";position:absolute;right:-14px;top:-12px;width:24px;height:24px;border-radius:50%;background:#ccc;border:3px solid #000}
.tt.on .arm{transform:rotate(-26deg)}
.pp{position:absolute;right:6%;bottom:6%;font:inherit;font-size:22px;background:#000;color:#fff;border:3px solid #fff;padding:2px 14px;cursor:pointer}
.pp:hover,.pp:focus-visible{background:#fff;color:#000;outline:none}
.shelf{display:grid;gap:8px}
.now{font-size:24px;margin:0 0 4px}
.disc{font:inherit;color:#fff;background:#000;border:3px solid #fff;display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:6px 10px;text-align:left;cursor:pointer;font-size:22px}
.disc .mini{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle,#000 0 8%,var(--col) 9% 38%,#111 39%);border:2px solid #fff}
.disc small{display:block;font-size:17px;opacity:.75}
.disc.sel{background:#2f8f2f}
.disc:hover,.disc:focus-visible{background:#fff;color:#000;outline:none}
.disc.lk{opacity:.55}
@media (max-width:700px){.deck{grid-template-columns:1fr}}
.bx.lk{min-height:130px;opacity:.75;background:repeating-linear-gradient(135deg,#000 0 14px,#111 14px 28px)}
@media (prefers-reduced-motion:reduce){#bg div,#wipe,#hero,.tt.on .vinyl{animation:none}}
@media (max-width:520px){#menu{margin-left:4vw}}
#gm{position:fixed;inset:0;z-index:5;background:#000;display:flex;align-items:center;justify-content:center}
#gm[hidden]{display:none}
#gm canvas{width:min(100vw,calc(100dvh*16/9));aspect-ratio:16/9;max-height:100dvh;background:#000}
#bars i{position:fixed;left:0;right:0;height:0;background:#000;z-index:21;transition:height 1.4s cubic-bezier(.7,0,.2,1)}
#bars i:first-child{top:0}#bars i:last-child{bottom:0}body.cine #bars i{height:13vh}
body.cine #intro{box-shadow:inset 0 0 20vw #000}
#flash{position:fixed;inset:0;z-index:30;background:#fff;opacity:0;pointer-events:none}
#flash.go{animation:fl 1.1s ease-out}@keyframes fl{0%{opacity:0}18%{opacity:1}100%{opacity:0}}
.words span.on{animation:cin 1.5s cubic-bezier(.2,.7,.2,1) both}
@keyframes cin{from{opacity:0;filter:blur(16px);transform:scale(1.6) translateY(-12px)}60%{opacity:1}to{opacity:1;filter:blur(0);transform:scale(1)}}
body.cine #logo .words{animation:push 9s linear forwards}@keyframes push{from{transform:scale(1)}to{transform:scale(1.1)}}
@media (prefers-reduced-motion:reduce){.words span.on,body.cine #logo .words,#flash.go{animation:none}.words span.on{opacity:1}}
</style>
</head>

const KEY='edd-contra-o-mundo';
let S={saves:[null,null,null],music:80,sfx:80,full:false,last:-1,ach:{}};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r));}catch(e){}
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let cur='main',busy=false,armed=-1,introOn=true,skip=false,sel=0;

function bump(key,dir){S[key]=Math.max(0,Math.min(100,S[key]+dir*20));persist();render(idx());}
function cycle(key){S[key]=S[key]>=100?0:S[key]+20;persist();render(idx());}
function fullscreen(){
  S.full=!S.full;persist();
  try{S.full?document.documentElement.requestFullscreen():document.fullscreenElement&&document.exitFullscreen();}catch(e){}
  render(idx());
}
function start(){const i=S.last;go(i>=0&&S.saves[i]?'chars':'saves');}
function pick(i){
  if(S.saves[i]&&armed!==i){armed=i;render(i);return;}
  S.saves[i]={t:Date.now()};S.last=i;unlock('save');persist();go('chars');
}

const idx=()=>[...$('list').children].indexOf(document.activeElement);

function render(focus=0){
  if(cur==='game'&&!introOn){['menu','chars','page','hero'].forEach(i=>$(i).hidden=true);GAME.start();return;}
  GAME.stop();$('logo').style.display='';
  if(cur!=='ost')stopTune();
  const pg=PAGES.includes(cur);
  if(!introOn){$('menu').hidden=cur==='chars'||pg;$('chars').hidden=cur!=='chars';$('page').hidden=!pg;
    const hr=$('hero');hr.hidden=cur==='chars'||pg;if(!hr.hidden)hr.src=IMG[S.hero&&IMG[S.hero]?S.hero:'edd'];}
  if(cur==='chars'){renderChars();return;}
  if(pg){renderPage();return;}
  const v=views[cur]();
  $('sub').textContent=v.title;
  $('note').textContent=v.note||'';
  const list=$('list');list.innerHTML='';
  v.items.forEach(([label,fn,adj],i)=>{
    const b=document.createElement('button');
    b.type='button';b.setAttribute('role','menuitem');b.textContent=label;if(v.primary===i)b.className='pri';
    b.onclick=()=>{if(!busy)fn();};b._adj=adj;list.append(b);
  });
  (list.children[Math.max(0,focus)]||list.children[0]).focus();
}

async function go(name){
  if(busy)return;busy=true;
  const w=$('wipe');
  w.style.transition='none';w.style.opacity='0';w.hidden=false;w.offsetWidth;
  w.style.transition='opacity .3s';w.style.opacity='1';
  await sleep(1000);
  cur=name;armed=-1;render();
  w.style.opacity='0';
  await sleep(320);
  w.hidden=true;busy=false;
}

addEventListener('keydown',e=>{
  if(introOn){skip=true;return;}
  if(busy||cur==='game')return;
  if(cur==='chars'){charKeys(e);return;}
  if(PAGES.includes(cur)){
    if(e.key==='Escape'){go('main');return;}
    const nx=e.key==='ArrowDown'||(cur==='ost'&&e.key==='ArrowRight'),pv=e.key==='ArrowUp'||(cur==='ost'&&e.key==='ArrowLeft');
    if((cur==='opts'||cur==='ost')&&(nx||pv)){e.preventDefault();const f=[...$('page').querySelectorAll('button,input')],i=f.indexOf(document.activeElement);f[(i+(nx?1:-1)+f.length)%f.length].focus();}
    return;}
  const bs=[...$('list').children],i=idx(),n=bs.length;
  if(e.key==='ArrowDown'){e.preventDefault();bs[(i+1)%n].focus();}
  else if(e.key==='ArrowUp'){e.preventDefault();bs[(i-1+n)%n].focus();}
  else if((e.key==='ArrowLeft'||e.key==='ArrowRight')&&bs[i]&&bs[i]._adj){
    e.preventDefault();bs[i]._adj(e.key==='ArrowRight'?1:-1);
  }
  else if(e.key==='Escape'&&cur!=='main')go('main');
});
